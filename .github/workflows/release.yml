name: release

# Собирает десктоп-сборки Deck и публикует их в ПУБЛИЧНЫЙ repo релизов (kioflex12/claude-deck-releases),
# чтобы любой обновлялся без токена. Исходники остаются здесь, в приватном claude-deck.
# Публикация в ДРУГОЙ repo → нужен PAT с правом записи в claude-deck-releases в секрете RELEASES_TOKEN
# (обычный GITHUB_TOKEN имеет права только на текущий repo). Триггер — пуш тега vX.Y.Z (или ручной запуск).
# Подпись не настроена (unsigned): Windows → SmartScreen, macOS → Gatekeeper (right-click → Open).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest   # раннер под админом → winCodeSign-симлинки распакуются штатно, шим НЕ нужен
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build & publish Windows (nsis + portable)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}   # PAT с contents:write в claude-deck-releases
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # без сертификата — не пытаться подписывать

  macos:
    runs-on: macos-latest   # приватный репо: минуты macOS тарифицируются ×10, но для релизов по тегам это приемлемо
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build & publish macOS (dmg + zip)
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}   # PAT с contents:write в claude-deck-releases
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
