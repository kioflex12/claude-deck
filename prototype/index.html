<title>Deck — доска контекстов</title>
<style>
  :root {
    --bg: #F5F6F8; --bg-elev: #FFFFFF; --surface: #FFFFFF; --surface-2: #FBFBFD;
    --border: #E4E7EC; --border-strong: #D2D7DF;
    --text: #1B1E26; --text-muted: #5E6774; --text-faint: #97A0AD;
    --accent: #C15F3C; --accent-ink: #A34C2E; --accent-soft: rgba(193,95,60,0.10);
    --good: #1F9D55; --good-soft: rgba(31,157,85,0.12);
    --warn: #B0740C; --warn-soft: rgba(176,116,12,0.13);
    --bad:  #D23B3B; --bad-soft:  rgba(210,59,59,0.12);
    --info: #2F6FEB; --info-soft: rgba(47,111,235,0.12);
    --shadow: 0 1px 2px rgba(16,20,28,.06), 0 6px 20px rgba(16,20,28,.06);
    --shadow-lift: 0 2px 4px rgba(16,20,28,.08), 0 14px 34px rgba(16,20,28,.14);
    --ui: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", "JetBrains Mono", Consolas, monospace;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0E1014; --bg-elev:#14171D; --surface:#171B22; --surface-2:#1C212B;
      --border:#262C36; --border-strong:#343C48;
      --text:#E7E9ED; --text-muted:#939BA8; --text-faint:#646E7D;
      --accent:#E5845E; --accent-ink:#F0A382; --accent-soft:rgba(229,132,94,0.14);
      --good:#45B871; --good-soft:rgba(69,184,113,0.15);
      --warn:#E0A93B; --warn-soft:rgba(224,169,59,0.15);
      --bad:#F0574F; --bad-soft:rgba(240,87,79,0.15);
      --info:#5C93F0; --info-soft:rgba(92,147,240,0.15);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.34);
      --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"] {
    --bg:#F5F6F8; --bg-elev:#FFFFFF; --surface:#FFFFFF; --surface-2:#FBFBFD;
    --border:#E4E7EC; --border-strong:#D2D7DF; --text:#1B1E26; --text-muted:#5E6774;
    --text-faint:#97A0AD; --accent:#C15F3C; --accent-ink:#A34C2E; --accent-soft:rgba(193,95,60,0.10);
    --good:#1F9D55; --good-soft:rgba(31,157,85,0.12); --warn:#B0740C; --warn-soft:rgba(176,116,12,0.13);
    --bad:#D23B3B; --bad-soft:rgba(210,59,59,0.12); --info:#2F6FEB; --info-soft:rgba(47,111,235,0.12);
    --shadow:0 1px 2px rgba(16,20,28,.06), 0 6px 20px rgba(16,20,28,.06);
    --shadow-lift:0 2px 4px rgba(16,20,28,.08), 0 14px 34px rgba(16,20,28,.14);
  }
  :root[data-theme="dark"] {
    --bg:#0E1014; --bg-elev:#14171D; --surface:#171B22; --surface-2:#1C212B;
    --border:#262C36; --border-strong:#343C48; --text:#E7E9ED; --text-muted:#939BA8;
    --text-faint:#646E7D; --accent:#E5845E; --accent-ink:#F0A382; --accent-soft:rgba(229,132,94,0.14);
    --good:#45B871; --good-soft:rgba(69,184,113,0.15); --warn:#E0A93B; --warn-soft:rgba(224,169,59,0.15);
    --bad:#F0574F; --bad-soft:rgba(240,87,79,0.15); --info:#5C93F0; --info-soft:rgba(92,147,240,0.15);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.34);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100vh; }
  a { color: inherit; }

  /* topbar */
  .topbar { display: flex; align-items: center; gap: 16px; padding: 11px 22px; background: var(--bg-elev); border-bottom: 1px solid var(--border); flex: none; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 7px; flex: none; background: linear-gradient(150deg, var(--accent), var(--accent-ink)); display: grid; place-items: center; color: #fff; font-family: var(--mono); font-weight: 700; font-size: 15px; box-shadow: 0 2px 8px var(--accent-soft); }
  .brand-name { font-weight: 680; font-size: 16px; letter-spacing: -0.01em; }
  .tag-concept { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 20px; align-self: center; }
  .tabs { display: flex; gap: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; margin-left: 4px; }
  .tab { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; cursor: pointer; font-family: var(--ui); font-size: 13px; font-weight: 560; color: var(--text-muted); padding: 6px 13px; border-radius: 7px; transition: .14s; }
  .tab svg { width: 14px; height: 14px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .spacer { flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; min-width: 230px; }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { color: var(--text-faint); flex: none; }
  .search input { border: 0; background: transparent; color: var(--text); font-family: var(--mono); font-size: 12.5px; width: 100%; outline: none; }
  .search input::placeholder { color: var(--text-faint); }
  .kbd { font-family: var(--mono); font-size: 10px; color: var(--text-faint); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; cursor: pointer; flex: none; }
  .kbd:hover { color: var(--text); }
  .filters { display: flex; gap: 6px; }
  .fchip { font-family: var(--mono); font-size: 12px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; transition: .14s; }
  .fchip:hover { border-color: var(--border-strong); color: var(--text); }
  .fchip[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); font-weight: 600; }

  /* now-strip */
  .now { display: flex; align-items: center; gap: 16px; flex: none; padding: 11px 22px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .now-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); display: flex; align-items: center; gap: 7px; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 var(--good-soft);} 70%{box-shadow:0 0 0 7px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }
  .now-id { font-family: var(--mono); font-weight: 700; color: var(--accent); font-size: 13px; }
  .now-title { font-weight: 600; }
  .now-meta { font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); display: flex; gap: 14px; align-items: center; }
  .now-meta b { color: var(--text); font-weight: 600; }
  .ctxbar { height: 6px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .ctxbar > i { display: block; height: 100%; border-radius: 4px; }
  .btn-resume { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 15px; font-family: var(--ui); font-weight: 640; font-size: 13px; cursor: pointer; transition: .14s; box-shadow: 0 2px 10px var(--accent-soft); }
  .btn-resume.now-btn { margin-left: auto; }
  .btn-resume:hover { filter: brightness(1.06); transform: translateY(-1px); }

  /* board */
  .board { flex: 1; display: flex; gap: 16px; padding: 18px 22px 26px; overflow-x: auto; overflow-y: hidden; }
  .col { flex: 0 0 314px; display: flex; flex-direction: column; min-height: 0; }
  .col-head { display: flex; align-items: center; gap: 9px; padding: 4px 4px 11px; position: relative; }
  .col-head::before { content: ""; position: absolute; left: 4px; top: 0; width: 28px; height: 3px; border-radius: 3px; background: var(--dot); }
  .col-title { font-weight: 660; font-size: 13.5px; margin-top: 6px; }
  .col-count { font-family: var(--mono); font-size: 11px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px; margin-top: 6px; }
  .col-body { display: flex; flex-direction: column; gap: 11px; overflow-y: auto; padding: 3px 4px 40px; margin: 0 -4px; flex: 1; }
  .col-body::-webkit-scrollbar { width: 8px; }
  .col-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 14px 12px; cursor: pointer; position: relative; overflow: hidden; box-shadow: var(--shadow); transition: transform .14s, box-shadow .14s, border-color .14s; animation: rise .4s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); border-color: var(--border-strong); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.stripe::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--st); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .wo { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent); }
  .card-title { font-weight: 570; font-size: 13.5px; line-height: 1.32; margin: 0 0 10px; letter-spacing: -0.005em; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .chip { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .chip.repo { color: var(--text); }
  .flag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 560; padding: 5px 9px; border-radius: 7px; margin-bottom: 10px; width: 100%; }
  .flag.paused { background: var(--warn-soft); color: var(--warn); }
  .flag.attention { background: var(--accent-soft); color: var(--accent-ink); }
  .flag.blocked { background: var(--bad-soft); color: var(--bad); }
  .flag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .card-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px 2px 5px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted); }
  .pill .d { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .d.pass { background: var(--good); } .d.fail { background: var(--bad); }
  .d.run { background: var(--warn); animation: blink 1.1s infinite; } @keyframes blink { 50% { opacity: .3; } }
  .d.none { background: var(--text-faint); }
  .pill.mr-open { color: var(--info); border-color: var(--info-soft); background: var(--info-soft); }
  .pill.mr-merged { color: var(--good); border-color: var(--good-soft); background: var(--good-soft); }
  .foot-sep { flex: 1; }
  .mini-ctx { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .mini-bar { width: 40px; height: 4px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .mini-bar > i { display: block; height: 100%; }

  /* skills */
  .skills-wrap { flex: 1; display: flex; min-height: 0; }
  .skills-rail { flex: 0 0 216px; border-right: 1px solid var(--border); background: var(--bg-elev); padding: 16px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
  .rail-label { font-family: var(--mono); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--text-faint); padding: 4px 10px 8px; }
  .cat { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; cursor: pointer; text-align: left; width: 100%; padding: 7px 10px; border-radius: 8px; color: var(--text-muted); font-family: var(--ui); font-size: 13px; transition: .12s; }
  .cat:hover { background: var(--surface-2); color: var(--text); }
  .cat[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .cat .c-count { margin-left: auto; font-family: var(--mono); font-size: 11px; opacity: .7; }
  .skills-main { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
  .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 13px; }
  .skill-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 15px 13px; box-shadow: var(--shadow); transition: .14s; animation: rise .4s both; }
  .skill-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .skill-head { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .skill-cmd-tag { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--accent); }
  .skill-cat-chip { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--text-faint); background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px; }
  .skill-does { font-size: 13px; color: var(--text); line-height: 1.45; margin-bottom: 10px; }
  .skill-trig { font-family: var(--mono); font-size: 11px; color: var(--text-muted); line-height: 1.5; border-top: 1px solid var(--border); padding-top: 9px; }
  .skill-trig b { color: var(--text-faint); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; font-size: 9.5px; display: block; margin-bottom: 4px; }
  .skill-foot { display: flex; align-items: center; gap: 9px; margin-top: 11px; }
  .skill-run { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; cursor: pointer; transition: .12s; }
  .skill-run:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .skill-file { font-family: var(--mono); font-size: 10.5px; }

  /* mcp view */
  #viewMcp { flex-direction: column; }
  .mcp-main { flex: 1; overflow-y: auto; padding: 22px 24px 40px; }
  .mcp-head { display: flex; align-items: baseline; gap: 12px; margin: 0 auto 16px; max-width: 1120px; }
  .mcp-head h2 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  .mcp-head .sub { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); }
  .mcp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 13px; max-width: 1120px; margin: 0 auto; }
  .mcp-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; animation: rise .4s both; }
  .mcp-card.authwait { border-style: dashed; }
  .mcp-top { display: flex; align-items: center; gap: 9px; }
  .mcp-name { font-family: var(--mono); font-weight: 700; font-size: 13.5px; color: var(--text); }
  .mcp-status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; padding: 3px 9px; border-radius: 20px; }
  .mcp-status.on { color: var(--good); background: var(--good-soft); }
  .mcp-status.off { color: var(--warn); background: var(--warn-soft); }
  .mcp-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; flex: 1; }
  .mcp-foot { display: flex; align-items: center; gap: 10px; }
  .mcp-cat { font-family: var(--mono); font-size: 10px; color: var(--text-faint); background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px; }
  .mcp-tools { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
  .mcp-btn { margin-left: auto; font-family: var(--ui); font-size: 12px; font-weight: 560; border-radius: 8px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); transition: .12s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .mcp-btn:hover { border-color: var(--border-strong); }
  .mcp-btn.activate { background: var(--accent); color: #fff; border-color: transparent; }
  .mcp-btn.activate:hover { filter: brightness(1.06); }

  /* session view */
  #viewSession { flex-direction: column; }
  .session-bar { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--bg-elev); border-bottom: 1px solid var(--border); flex: none; }
  .back { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); border-radius: 8px; padding: 6px 11px; font-family: var(--ui); font-size: 12.5px; cursor: pointer; transition: .14s; }
  .back:hover { color: var(--text); border-color: var(--border-strong); }
  .sb-wo { font-family: var(--mono); font-weight: 700; color: var(--accent); font-size: 13px; }
  .sb-title { font-weight: 620; font-size: 14px; }
  .sb-jira { font-family: var(--mono); font-size: 10.5px; padding: 3px 9px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--border); }
  .session-body { flex: 1; display: flex; min-height: 0; }
  .session-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .transcript { flex: 1; overflow-y: auto; padding: 26px 28px 8px; }
  .thread { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .msg { display: flex; flex-direction: column; gap: 7px; animation: rise .3s both; }
  .msg-head { display: flex; align-items: center; gap: 9px; }
  .ava { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 700; flex: none; }
  .ava.u { background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text-muted); }
  .ava.a { background: linear-gradient(150deg, var(--accent), var(--accent-ink)); color: #fff; }
  .who { font-size: 12px; font-weight: 640; color: var(--text-muted); }
  .msg-body { font-size: 14px; line-height: 1.62; color: var(--text); padding-left: 31px; }
  .msg.u .msg-body { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; margin-left: 31px; }
  .msg-body code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; }
  .msg.u .msg-body code { background: var(--bg-elev); }
  .tool-row { margin-left: 31px; display: inline-flex; align-items: center; gap: 8px; width: fit-content; max-width: 100%; font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; animation: rise .3s both; }
  .tool-row .tn { color: var(--accent-ink); font-weight: 700; }
  .tool-row .ta { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-row .tstat { color: var(--good); border-left: 1px solid var(--border-strong); padding-left: 8px; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin: 0 1px; border-radius: 50%; background: var(--text-faint); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100%{ transform: translateY(0); opacity:.4 } 30%{ transform: translateY(-4px); opacity:1 } }

  .composer { flex: none; padding: 12px 20px 18px; background: var(--bg-elev); border-top: 1px solid var(--border); }
  .composer-inner { max-width: 820px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 10px 13px 9px; transition: .14s; }
  .composer-inner:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .composer textarea { border: 0; background: transparent; resize: none; outline: none; color: var(--text); font-family: var(--ui); font-size: 14px; line-height: 1.5; width: 100%; min-height: 22px; max-height: 150px; display: block; }
  .composer textarea::placeholder { color: var(--text-faint); }
  .composer-foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .model-tag { font-family: var(--mono); font-size: 11px; color: var(--text-faint); display: inline-flex; align-items: center; gap: 6px; }
  .send-btn { margin-left: auto; width: 30px; height: 30px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center; transition: .14s; }
  .send-btn:hover { filter: brightness(1.08); }
  .send-btn:disabled { opacity: .4; cursor: default; filter: none; }

/* ---------- board ---------- */
function boardMatch(t) {
  if (filter !== 'all' && !t.groups.includes(filter)) return false;
  if (query && !(t.id + ' ' + t.title).toLowerCase().includes(query)) return false;
  return true;
}
function cardHTML(t) {
  const stripe = t.flag ? `class="card stripe" style="--st:${t.flag.type==='blocked'?'var(--bad)':t.flag.type==='paused'?'var(--warn)':'var(--accent)'}"` : 'class="card"';
  const chips = t.scope.map((s,i)=>`<span class="chip${i===0?' repo':''}">${s}</span>`).join('');
  const flag = t.flag ? `<div class="flag ${t.flag.type}"><span class="dot"></span>${t.flag.label}</div>` : '';
  const mrs = t.mrs.map(m=>`<span class="pill mr-${m.state}"><span class="d ${m.state==='merged'?'pass':m.state==='draft'?'none':''}"></span>${m.id}</span>`).join('');
  const builds = t.builds.map(b=>`<span class="pill"><span class="d ${b.state}"></span>${b.platform}</span>`).join('');
  let ctx = '';
  const st = t.session.state;
  if (st!=='none' && st!=='archived') ctx = `<span class="mini-ctx"><span class="mini-bar"><i style="width:${Math.round(t.session.ctx*100)}%;background:${ctxColor(t.session.ctx)}"></i></span>${Math.round(t.session.ctx*100)}%</span>`;
  else if (st==='archived') ctx = `<span class="mini-ctx">архив</span>`;
  const foot = (mrs||builds||ctx) ? `<div class="card-foot">${mrs}${builds}<span class="foot-sep"></span>${ctx}</div>` : '';
  return `<article ${stripe} tabindex="0" role="button" data-id="${t.id}"><div class="card-top"><span class="wo">${t.id}</span></div><h3 class="card-title">${t.title}</h3><div class="chips">${chips}</div>${flag}${foot}</article>`;
}
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = COLUMNS.map(c => {
    const items = TASKS.filter(t => t.col===c.key && boardMatch(t));
    const body = items.length ? items.map((t,i)=>cardHTML(t).replace('<article ',`<article style="animation-delay:${i*40}ms" `)).join('') : `<div class="empty">— пусто —</div>`;
    return `<section class="col"><div class="col-head" style="--dot:${c.dot}"><span class="col-title">${c.title}</span><span class="col-count">${items.length}</span></div><div class="col-body">${body}</div></section>`;
  }).join('');
  board.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => openSession(el.dataset.id));
    el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); openSession(el.dataset.id); } });
  });
}
function renderNow() {
  const t = TASKS.find(x=>x.current) || TASKS.find(x=>x.col==='progress'); const s = t.session;
  document.getElementById('now').innerHTML = `
    <span class="now-label"><span class="pulse"></span>текущий контекст</span>

  document.querySelector('.now-btn').addEventListener('click', e => openSession(e.currentTarget.dataset.id));
}

/* ---------- skills ---------- */
function skillMatch(sk) {
  if (skillCat !== 'all' && sk.cat !== skillCat) return false;
  if (query && !(sk.cmd + ' ' + sk.does + ' ' + sk.trig).toLowerCase().includes(query)) return false;
  return true;
}
function renderSkills() {
  const rail = document.getElementById('rail');
  rail.innerHTML = `<div class="rail-label">Категории</div>` + CATS.map(c => {
    const n = c.key==='all' ? SKILLS.length : SKILLS.filter(s=>s.cat===c.key).length;
    return `<button class="cat" data-c="${c.key}" aria-pressed="${c.key===skillCat}">${c.label}<span class="c-count">${n}</span></button>`;
  }).join('');
  rail.querySelectorAll('.cat').forEach(b => b.addEventListener('click', () => { skillCat = b.dataset.c; renderSkills(); }));
  const grid = document.getElementById('skillsGrid');

    </div>`;
  const branchRows = t.branches.length ? t.branches.map(b=>{
      const val = b.repo==='диагностика' ? b.name : aStub(`${GL}${repoSlug(b.repo)}/-/tree/${b.name}`, b.name);

  const mrRows = t.mrs.length ? t.mrs.map(m=>{

      const link = b.id ? aStub(TC+b.id, '#'+b.num) : `<span style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-faint)">${b.num}</span>`;
      return `<div class="build-row"><span class="plat">${b.platform}</span><span class="build-state"><span class="d ${b.state}"></span>${lbl}</span><span style="margin-left:auto">${link}</span></div>`;
    }).join('') : `<div class="empty" style="text-align:left;padding:2px">— сборок не было —</div>`;
  const notes = t.notes.map(n=>`<li class="${n.warn?'warn':''}">${n.t}</li>`).join('');
  return `
    <div class="sec"><div class="sec-label">Описание</div><div class="desc">${t.desc}</div></div>
    ${sessionSec}
    <div class="sec"><div class="sec-label">Ветки</div>${branchRows}</div>
    <div class="sec"><div class="sec-label">Merge Requests</div>${mrRows}</div>
    <div class="sec"><div class="sec-label">Сборки</div>${buildRows}</div>
    <div class="sec"><div class="sec-label">Заметки для возврата</div><ul class="notes">${notes}</ul>
      <div class="side-actions">
        <a class="btn-ghost" href="${JIRA}${t.id}" target="_blank" rel="noopener"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg> Открыть задачу в Jira</a>
        <button class="btn-ghost"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 3v12M18 9v12M6 15a6 6 0 0 0 6 6h1"/><circle cx="6" cy="3" r="2"/><circle cx="18" cy="9" r="2"/></svg> Форкнуть сессию</button>
      </div>
    </div>`;
}
function msgHTML(m) {
  if (m.k === 'tool') return `<div class="tool-row"><span class="tn">⚙ ${m.n}</span><span class="ta">${m.a}</span><span class="tstat">${m.s}</span></div>`;
  if (m.typing) return `<div class="msg"><div class="msg-head"><span class="ava a">C</span><span class="who">Claude</span></div><div class="msg-body"><span class="typing"><span></span><span></span><span></span></span></div></div>`;
  const kind = m.k || m.r;
  const head = kind==='u' ? `<span class="ava u">Я</span><span class="who">Ты</span>` : `<span class="ava a">C</span><span class="who">Claude</span>`;
  return `<div class="msg ${kind}"><div class="msg-head">${head}</div><div class="msg-body">${m.t}</div></div>`;
}
function renderThread(t) {
  document.getElementById('thread').innerHTML = t.chat.map(msgHTML).join('');
  const tr = document.getElementById('transcript'); tr.scrollTop = tr.scrollHeight;
}
function renderComposer(t) {
  const c = document.getElementById('composer'); const st = t.session.state;
  if (st === 'archived') {
    c.innerHTML = `<div class="archived-note"><span>Сессия в архиве — read-only.</span><button class="btn-ghost" style="margin-left:auto" onclick="reopen('${t.id}')">Открыть для продолжения</button></div>`;
    return;
  }
  c.innerHTML = `
    <div class="composer-inner">
      <textarea id="composer-ta" rows="1" placeholder="Написать в сессию ${t.id}…  (Enter — отправить, Shift+Enter — перенос)"></textarea>
      <div class="composer-foot">
        <span class="model-tag"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>${t.session.model}</span>
        <span class="model-tag">окно ${Math.round(t.session.ctx*100)}%</span>
        <button class="send-btn" id="sendBtn" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="m3 20 18-8L3 4v6l12 2-12 2z"/></svg></button>
      </div>
    </div>`;
  const ta = document.getElementById('composer-ta'), btn = document.getElementById('sendBtn');
  const grow = () => { ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,150)+'px'; btn.disabled = !ta.value.trim(); };
  ta.addEventListener('input', grow);
  ta.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  btn.addEventListener('click', send);
  setTimeout(()=>ta.focus(), 60);
}
function send() {
  const ta = document.getElementById('composer-ta'); if (!ta) return;
  const v = ta.value.trim(); if (!v) return;
  const t = TASKS.find(x=>x.id===currentSessionId); if (!t) return;
  t.chat.push({ k:'u', t: escHtml(v) }); t.session.msgs += 1;
  ta.value=''; ta.style.height='auto'; document.getElementById('sendBtn').disabled = true;
  t.chat.push({ typing:true }); renderThread(t);
  setTimeout(() => {
    t.chat = t.chat.filter(m => !m.typing);
    t.chat.push({ k:'a', t:'<i style="opacity:.7">демо-ответ:</i> в реальном приложении здесь пошёл бы живой стрим ответа Claude по этой сессии через Agent SDK. Сейчас это макет — но поле ввода и переписка настоящие.' });
    t.session.msgs += 1; renderThread(t);
  }, 850);
}
function reopen(id) { const t = TASKS.find(x=>x.id===id); if (!t) return; t.session.state = 'idle'; openSession(id); }
function openSession(id) {
  const t = TASKS.find(x=>x.id===id); if (!t) return;
  currentSessionId = id;
  document.getElementById('viewBoard').style.display = 'none';
  document.getElementById('viewSkills').style.display = 'none';
  document.getElementById('viewMcp').style.display = 'none';
  document.getElementById('viewSession').style.display = 'flex';
  document.getElementById('filters').style.display = 'none';
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected','false'));
  document.getElementById('sessionBar').innerHTML = `
    <button class="back" id="backBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18 9 12l6-6"/></svg> Доска</button>
    <span class="sb-wo">${aReal(JIRA+t.id, t.id, 'plain')}</span><span class="sb-title">${t.title}</span><span class="sb-jira">${aReal(JIRA+t.id, 'Jira · '+t.jira, 'plain')}</span>`;
  document.getElementById('backBtn').addEventListener('click', () => setView('board'));
  document.getElementById('sessionSide').innerHTML = sideHTML(t);
  const st = t.session.state;
  if (st === 'none') {
    document.getElementById('thread').innerHTML = `
      <div class="empty-session">
        <div class="es-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
        <h3>Контекст ещё не заведён</h3>
        <p>Для этой задачи пока нет сессии Claude. Заведи новый контекст — он привяжется к карточке и ветке.</p>
        <button class="btn-resume" style="margin:14px auto 0" onclick="reopen('${t.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg> Завести контекст</button>
      </div>`;
    document.getElementById('composer').innerHTML = '';
  } else { renderThread(t); renderComposer(t); }
}

/* ---------- command palette ---------- */
function palIndex() {
  const idx = [];
  idx.push({type:'Вид', label:'Доска задач', sub:'kanban', act:()=>setView('board')});
  idx.push({type:'Вид', label:'Скиллы', sub:'каталог', act:()=>setView('skills')});
  idx.push({type:'Вид', label:'MCP-инструменты', sub:'серверы', act:()=>setView('mcp')});
  TASKS.forEach(t=>idx.push({type:'Задача', label:`${t.id} · ${t.title}`, sub:t.jira, key:(t.id+' '+t.title).toLowerCase(), act:()=>openSession(t.id)}));
  SKILLS.forEach(s=>idx.push({type:'Скилл', label:`/${s.cmd}`, sub:s.does, key:(s.cmd+' '+s.does+' '+s.trig).toLowerCase(), act:()=>{ setView('skills'); const q=document.getElementById('q'); q.value=s.cmd; query=s.cmd; renderSkills(); }}));
  MCP_SERVERS.forEach(m=>idx.push({type:'MCP', label:m.name, sub:m.status==='active'?'активен':'нужна авторизация', key:(m.name+' '+m.desc).toLowerCase(), act:()=>setView('mcp')}));
  return idx;
}
let palItems = [], palSel = 0;
const palShown = () => Math.min(palItems.length, 40);
function openPal(){ document.getElementById('palBack').classList.add('open'); const i=document.getElementById('palInput'); i.value=''; renderPal(''); setTimeout(()=>i.focus(),40); }
function closePal(){ document.getElementById('palBack').classList.remove('open'); }
function renderPal(q){
  const all = palIndex(); q = q.trim().toLowerCase();
  palItems = q ? all.filter(x=>(x.key||x.label.toLowerCase()).includes(q)) : all;
  palSel = 0;
  const list = document.getElementById('palList');
  list.innerHTML = palItems.length ? palItems.slice(0,40).map((x,i)=>`<div class="pal-item ${i===0?'sel':''}" data-i="${i}"><span class="pal-type">${x.type}</span><span class="pal-label">${x.label}</span><span class="pal-sub">${x.sub||''}</span></div>`).join('') : `<div class="pal-empty">Ничего не найдено</div>`;
  list.querySelectorAll('.pal-item').forEach(el=>{ el.addEventListener('click',()=>runPal(+el.dataset.i)); el.addEventListener('mousemove',()=>setSel(+el.dataset.i)); });
}
function setSel(i){ palSel=i; document.querySelectorAll('.pal-item').forEach((el,j)=>el.classList.toggle('sel',j===i)); const s=document.querySelector('.pal-item.sel'); if(s) s.scrollIntoView({block:'nearest'}); }
function runPal(i){ const it=palItems[i]; if(!it) return; closePal(); it.act(); }

/* ---------- view switch + events ---------- */
function setView(v) {
  activeView = v; currentSessionId = null;
  document.getElementById('viewBoard').style.display = v==='board' ? 'flex' : 'none';
  document.getElementById('viewSkills').style.display = v==='skills' ? 'flex' : 'none';
  document.getElementById('viewMcp').style.display = v==='mcp' ? 'flex' : 'none';
  document.getElementById('viewSession').style.display = 'none';
  document.getElementById('filters').style.display = v==='board' ? 'flex' : 'none';
  const ph = { board:'фильтр задач…', skills:'поиск скиллов…', mcp:'поиск MCP-серверов…' };
  document.getElementById('q').placeholder = ph[v] || 'поиск…';
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.v===v)));
  if (v==='skills') renderSkills(); else if (v==='mcp') renderMcp(); else renderBoard();
}
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setView(b.dataset.v); });
document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); if (activeView==='skills') renderSkills(); else if (activeView==='mcp') renderMcp(); else renderBoard(); });
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('.fchip'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.fchip').forEach(x => x.setAttribute('aria-pressed', String(x===b)));
  renderBoard();
});
document.getElementById('palTrigger').addEventListener('click', openPal);
document.getElementById('palInput').addEventListener('input', e => renderPal(e.target.value));
document.getElementById('palBack').addEventListener('click', e => { if (e.target.id==='palBack') closePal(); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k') { e.preventDefault(); openPal(); return; }
  const palOpen = document.getElementById('palBack').classList.contains('open');
  if (palOpen) {
    if (e.key==='Escape') closePal();
    else if (e.key==='ArrowDown') { e.preventDefault(); setSel(Math.min(palSel+1, palShown()-1)); }
    else if (e.key==='ArrowUp') { e.preventDefault(); setSel(Math.max(palSel-1, 0)); }
    else if (e.key==='Enter') { e.preventDefault(); runPal(palSel); }
    return;
  }
  if (e.key==='Escape' && currentSessionId) setView('board');
});

renderNow();
renderBoard();
</script>
