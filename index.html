<title>Deck — доска контекстов</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/deck.css">

<div class="app">
  <header class="topbar">
    <div class="brand" title="На главную (доска статусов)"><div class="brand-mark">D</div><div class="brand-name">Deck</div></div>
    <div class="proj-switch" id="projSwitch">
      <button class="proj-btn" id="projBtn" type="button" title="Проект (папка)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span id="projName">Все проекты</span>
        <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="proj-menu" id="projMenu" hidden></div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab" data-v="board" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="18" rx="1.5"/><rect x="10" y="3" width="6" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="8" rx="1.5"/></svg>Доска</button>
      <button class="tab" data-v="workspace" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 12h9"/></svg>Воркспейс</button>
      <button class="tab" data-v="attention" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Внимание</button>
      <button class="tab" data-v="skills" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m13 2-3 8h6l-3 12"/></svg>Скиллы</button>
      <button class="tab" data-v="mcp" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>MCP</button>
    </div>
    <div class="spacer"></div>
    <button id="authChip" class="auth-chip" type="button" title="Авторизация Claude">Claude…</button>
    <button id="usageInd" class="usage-ind" type="button" title="Использование лимитов Claude"><span class="ui-bar"><i id="usageBarFill"></i></span><span class="ui-pct" id="usagePct">—</span></button>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Поиск…" autocomplete="off" spellcheck="false">
      <button id="qClear" class="q-clear" type="button" title="Очистить" hidden>✕</button>
      <kbd class="kbd" id="palTrigger" title="Командная палитра">Ctrl K</kbd>
      <div class="q-drop" id="qDrop" hidden></div>
    </label>
    <button id="svcHealth" class="svc-health" type="button" hidden></button>
    <button id="notifyBtn" class="notify-btn" type="button" title="Уведомления о завершении" aria-pressed="false">🔕</button>
    <button id="settingsBtn" class="notify-btn" type="button" title="Настройки">⚙</button>
  </header>
  <div id="authGate" class="auth-gate" hidden><span class="ag-msg">Вы не вошли в Claude — чат, лимиты и новые сессии недоступны.</span><button id="authGateBtn" class="ag-btn" type="button">Войти в Claude</button></div>
  <div id="svcGate" class="auth-gate svc-gate" hidden><span class="ag-msg" id="svcGateMsg"></span><button id="svcGateBtn" class="ag-btn" type="button">Открыть настройки</button></div>

  <div id="viewBoard" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="now" id="now"></div>
    <div class="board-filters" id="filters"></div>
    <main class="board" id="board"></main>
  </div>

  <div id="viewSkills" style="display:none;flex:1;min-height:0">
    <div class="skills-wrap"><nav class="skills-rail" id="rail"></nav><div class="skills-main"><div class="skills-grid" id="skillsGrid"></div></div></div>
  </div>

  <div id="viewMcp" style="display:none;flex-direction:column;flex:1;min-height:0"></div>

  <div id="viewAttention" style="display:none;flex:1;min-height:0;overflow:auto"></div>

  <div id="viewWorkspace" style="display:none;flex:1;min-height:0"></div>

  <div id="viewSession" style="display:none;flex:1;min-height:0">
    <div class="session-bar" id="sessionBar"></div>
    <div class="session-body">
      <div class="session-main">
        <div class="transcript" id="transcript"><div class="thread" id="thread"></div></div>
        <div class="composer" id="composer"></div>
      </div>
      <aside class="session-side" id="sessionSide"></aside>
      <button class="side-toggle" id="sideToggle" type="button" title="Показать/скрыть панель (описание, MR, сборки, Jira)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </div>
  </div>

</div>

<div class="pal-back" id="palBack">
  <div class="pal">
    <div class="pal-in"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="palInput" type="text" placeholder="Перейти к задаче, скиллу, MCP или виду…" autocomplete="off" spellcheck="false"></div>
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot"><span>↑↓ навигация</span><span>↵ выбрать</span><span>esc закрыть</span></div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
